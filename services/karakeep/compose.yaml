networks:
  karakeep:
  nexus:
    external: true
    name: ${NEXUS_NETWORK:-nexus}
services:
  karakeep:
    cap_drop:
      - ALL
    container_name: karakeep
    depends_on:
      karakeep-chrome:
        condition: service_started
      karakeep-meilisearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    environment:
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DATA_DIR: /data
      DB_WAL_MODE: "true"
      DISABLE_PASSWORD_AUTH: "false"
      DISABLE_SIGNUPS: ${KARAKEEP_DISABLE_SIGNUPS:-true}
      LOG_LEVEL: notice
      MEILI_ADDR: http://karakeep-meilisearch:7700
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY:?}
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET:?}
      NEXTAUTH_URL: https://links.${DOMAIN:?DOMAIN not set}
      RATE_LIMITING_ENABLED: "true"
    hostname: karakeep
    image: ghcr.io/karakeep-app/karakeep:0.33.1
    labels:
      gatus.group: productivity
      gatus.priority: P2
      homepage.description: Links, references, and inspiration
      homepage.group: Productivity
      homepage.href: https://links.${DOMAIN:?DOMAIN not set}
      homepage.icon: karakeep
      homepage.name: Karakeep
    networks:
      - karakeep
      - nexus
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    volumes:
      - ${DATA_PATH:?DATA_PATH not set}/karakeep/data:/data
  karakeep-chrome:
    cap_drop:
      - ALL
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    container_name: karakeep-chrome
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M
    image: gcr.io/zenika-hub/alpine-chrome:124
    networks:
      - karakeep
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
  karakeep-meilisearch:
    cap_drop:
      - ALL
    container_name: karakeep-meilisearch
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M
    environment:
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY:?}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:7700/health || exit 1
      timeout: 5s
    image: getmeili/meilisearch:v1.41.0
    networks:
      - karakeep
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
    volumes:
      - ${DATA_PATH:?DATA_PATH not set}/karakeep/meilisearch:/meili_data
